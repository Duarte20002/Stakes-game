<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
    <script src="update.js"></script>
</head>
<body>
  <div class="container">
    <form action="/login" method="POST">
      <h1>STAKES</h1>
      <fieldset>
        <legend>Login Information</legend><br/>
        Username: <br/>
        <input type="text" id="username_login" name="username_login"><br/><br/>
        Password: <br/>
        <input type="password" id="password_login" name="password_login"><br/><br/>
        <button type="submit">Login</button>
      </fieldset>

      <p>
        Don't have an account? <a href="register.html">Sign up here</a>.
      </p>
    </form>
  </div>
</body>
</html>
