<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lobby</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="./js/lobby.js"></script>
</head>
<body>
  <div class="lobby-container">
    <form>
      <h1>Welcome to STAKES!</h1>
      <fieldset>
        <legend>Lobby</legend>
        <button id="find-match" onclick="FindMatch()" type="button" style="display: none;">Find Match</button>
        <button id="quit-match" onclick="QuitMatch()" type="button" style="display: none;">Leave Queue</button>
        <br/>
        <button id="logout" onclick="Logout()" type="button">Logout</button>
        <br/>
      </fieldset>
    </form>
  </div>

  <div class="audio-message" style="margin-top: 20px;">
    <audio id="welcome-audio">
      <source src="elevator_music.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

  <script>
    GetMatchState();
    setInterval(GetMatchState, 3000);
    
    function playAudioOnce() {
    const audio = document.getElementById('welcome-audio');
    if (audio) {
      audio.volume = 0.3;
      audio.play().catch((err) => {
        console.warn("Audio playback failed:", err);
      });
    }
    document.removeEventListener('click', playAudioOnce);
  }

  document.addEventListener('click', playAudioOnce);
  </script>
</body>
</html>
