<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lobby</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="./js/lobby.js"></script>
</head>
<body>
  <div class="lobby-container">
    <form>
      <h1>Welcome to STAKES!</h1>
      <fieldset>
        <legend>Lobby</legend>
        <button id="find-match" onclick="FindMatch()" type="button" style="display: none;">Find Match</button>
        <button id="quit-match" onclick="QuitMatch()" type="button" style="display: none;">Leave Queue</button>
        <br/>
        <button id="logout" onclick="Logout()" type="button">Logout</button>
        <br/>
      </fieldset>
    </form>
  </div>

  <script>
    GetMatchState();
    setInterval(GetMatchState, 3000);
  </script>
</body>
</html>
